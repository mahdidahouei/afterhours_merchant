server {
    listen 80;
    server_name localhost;

    location /checkhealth {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 "OK";
    }

    # Runtime env config — never cache. Its contents differ per environment and
    # are replaced on every container start; a cached copy would point the app
    # at the wrong backend after a redeploy.
    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # The service worker must never be cached, or clients can never learn that a
    # new build exists.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Unhashed and small — revalidate rather than letting the catch-all cache it.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Content-hashed build output — safe to cache forever.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fonts and hero media are versioned by path, not by hash, so revalidate
    # weekly rather than pinning them for a year.
    location ~* ^/(fonts|media)/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
