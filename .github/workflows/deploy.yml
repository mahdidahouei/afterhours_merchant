name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-uploaded artifact can't become the live site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The custom domain this site is served from. Because it is a domain root
  # rather than a /<repo>/ subpath, the app builds with base "/" — see the
  # Build step. Clear this and the BASE_PATH override together if you ever go
  # back to <user>.github.io/<repo>/.
  CUSTOM_DOMAIN: afterhours-merchant.mahdidahouei.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Served from the root of a custom domain, so no path prefix. (On a
          # bare github.io project site this would be /<repo>/ instead.)
          BASE_PATH: /
          # The owner API is live, so the deploy talks to it. This also drops
          # the mock and the "Screens" jump-to panel from the bundle.
          #
          # NOTE: the API allowlists CORS origins, and this domain has to be on
          # that list or every call fails from here. See README → Updates.
          VITE_USE_MOCK: "false"
        run: npm run build

      - name: Set the Mapbox token
        # The token is public by design but GitHub's push protection rejects
        # Mapbox tokens on sight, so it is not committed. Set MAPBOX_TOKEN as a
        # repository secret to switch the details map on; without it the step
        # falls back to the address and a Google Maps link.
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -n "$MAPBOX_TOKEN" ]; then
            node -e '
              const fs = require("fs");
              const p = "dist/config.js";
              fs.writeFileSync(
                p,
                fs.readFileSync(p, "utf8").replace(
                  /MAPBOX_TOKEN:\s*""/,
                  `MAPBOX_TOKEN: ${JSON.stringify(process.env.MAPBOX_TOKEN)}`,
                ),
              );
            '
            echo "Mapbox token written into dist/config.js"
          else
            echo "No MAPBOX_TOKEN secret set — the map will fall back to the address."
          fi

      - name: Set custom domain
        # Pages reads CNAME from the published artifact. Without it, deploying
        # from Actions can clear the custom domain configured in Settings and
        # drop the site back to <user>.github.io.
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME

      - name: Add SPA fallback
        # Pages has no rewrite rules: a deep link like /claim is a 404 at the
        # CDN before the app ever loads. Serving index.html as the 404 page
        # hands those URLs to the router instead.
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll
        # Without this, Pages' Jekyll step strips files and folders whose names
        # begin with an underscore.
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # .nojekyll is a dotfile, and this action drops hidden files by
          # default — without this it never reaches the artifact.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
