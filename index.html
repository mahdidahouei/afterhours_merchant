<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Runtime API config. A classic (non-module) script so it runs before the
      deferred module bundle, guaranteeing window.__ENV__ exists by the time the
      app reads it. Rendered per environment at container start — see Dockerfile.
    -->
    <script src="/config.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Receive reservations from 10,000+ Gen Z and Millennial diners. Afterhours plugs straight into Guestplan, Formitable and GoTable — no admin, no fees."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/apple-icon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />

    <!-- Paint the first two hero posters before the JS has even parsed. -->
    <link rel="preload" as="image" href="/media/hero/01.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/media/hero/02.webp" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DC7HWH7ECR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      // Route changes are reported by the app; see src/app/analytics.ts.
      gtag("config", "G-DC7HWH7ECR", { send_page_view: false });
    </script>

    <!-- Mailchimp — async so it never blocks the main thread. -->
    <script
      async
      src="https://chimpstatic.com/mcjs-connected/js/users/fe0be2b5872935315f3b20186/5c46603820940685997caa51e.js"
    ></script>

    <title>Afterhours</title>
  </head>

  <body>
    <!-- Portal host for dialogs, so they escape the wizard's clipped containers. -->
    <div id="overlay"></div>
    <div id="root"></div>

    <!-- Removed by the hero once there is something real to look at. -->
    <div
      id="splash-screen"
      style="
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: -1;
      "
    >
      <img src="/splash.png" alt="" style="width: 139px; height: auto; object-fit: contain" />
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
